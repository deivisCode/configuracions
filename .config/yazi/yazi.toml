[mgr]
ratio          = [ 1, 1, 2 ]
sort_by        = "alphabetical"
sort_sensitive = true
sort_reverse   = false
sort_dir_first = true
# :FACER: as veces sí quero ver permisos, tamaños, e tal..
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
title_format   = "Yazi"

[opener]
edit = [
    { run = 'nvim "$@"', desc = "$EDITOR", block = true },
]
open = [
    { run = 'xdg-open "$1"', desc = "Open" },
]
reveal = [
    { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal" },
    { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF" },
]
extract = [
    { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
]
play = [
    { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
    { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info"},
]

[input]
cursor_blink = false

# cd
cd_title  = "Crear diretorio:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = ["Crear:", "Crear (dir):"]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Cambiar o nome:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# filter
filter_title  = "Filtrar:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Buscar seguinte:", "Buscar anterior:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Buscar con {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
# trash
trash_title     = "¿Borrar {n} cousa(s)?"
trash_origin    = "center"
trash_offset    = [ 0, 0, 70, 20 ]

# delete
delete_title    = "¿Eliminar esto para sempre?"
delete_origin   = "center"
delete_offset   = [ 0, 0, 70, 20 ]

# overwrite
overwrite_title   = "¿Sorbeescribir ficheiro?"
overwrite_content = "Vas sobreescribir:"
overwrite_origin  = "center"
overwrite_offset  = [ 0, 0, 50, 15 ]

# quit
quit_title   = "Quit?"
quit_content = "¿Estase rulando espa aplicación, queres saír?"
quit_origin  = "center"
quit_offset  = [ 0, 0, 50, 15 ]
