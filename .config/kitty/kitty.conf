# shell bash
shell nu

# TIPOGRAFIAS
font_family family="FiraCode Nerd Font" style="Light"
italic_font family="JetBrainsMono Nerd Font" style="Italic"
bold_font family="FiraCode Nerd Font" style="Bold"
bold_italic_font family="FiraCode Nerd Font" style="Bold Italic"
font_size 13.0

# CURSOR
cursor #ff0000
cursor_text_color #000000
cursor_shape block
cursor_trail 30
cursor_trail_decay 0.1 0.4

# LINKS
url_color #0000ff
show_hyperlink_targets yes

# RATO
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left press ungrabbed mouse_selection normal
mouse_map right press ungrabbed copy_to_clipboard

# OUTROS
enable_audio_bell no

# LAYOUT
scrollback_lines 1000
remember_window_size  yes
initial_window_width  200
initial_window_height 400
enabled_layouts splits,stack
window_resize_step_cells 2
window_resize_step_lines 2

# FONDO
background_opacity 0.85
background_image none
background_image_layout tiled
background_image_linear no
dynamic_background_opacity yes

visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
allow_remote_control yes
startup_session session.conf
allow_hyperlinks yes
shell_integration no-cursor
term xterm-256color
kitty_mod ctrl+shift
map kitty_mod+enter no-op
map cmd+enter       no-op
nap ctrl+a>x no-op
map ctrl+a>] no-op
map ctrl+a>[ no-op
map ctrl+a>period no-op
map ctrl+a>comma no-op
map kitty_mod+t launch no-op
map ctrl+a>c no-op
map ctrl+a>, no-op
map ctrl+equal  no-op
map ctrl+plus   change_font_size all +2.0
map ctrl+kp_add no-op
map ctrl+minus       change_font_size all -2.0
map ctrl+kp_subtract no-op
map ctrl+0 change_font_size all 0
map f11 no-op
map ctrl+a>e no-op
map ctrl+a>shift+e no-op
map ctrl+a>shift+r combine : load_config_file : launch --type=overlay sh -c 'echo "kitty config reloaded."; echo; read -r -p "Press Enter to exit"; echo ""'
map ctrl+a>shift+d     no-op
map ctrl+a>space no-op
map f3 no-op
map ctrl+a>ctrl+a no-op
